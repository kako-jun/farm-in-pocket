name = "farm-in-pocket-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[observability]
enabled = true

# D1 binding
# 本番 DB は `wrangler d1 create farm-in-pocket` で作成し、
# 出力された database_id を下の REPLACE_WITH_PROD_DATABASE_ID に貼り替えること。
# ローカル開発は `pnpm migrate:local` でローカル sqlite に migration が適用される
# （.wrangler/state/v3/d1/ に sqlite ファイルが生成される）。
[[d1_databases]]
binding = "DB"
database_name = "farm-in-pocket"
database_id = "REPLACE_WITH_PROD_DATABASE_ID"
migrations_dir = "migrations"
