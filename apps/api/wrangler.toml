name = "farm-in-pocket-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[observability]
enabled = true

# mypace API のベース URL。dev override は .dev.vars に MYPACE_API_URL を書く。
[vars]
MYPACE_API_URL = "https://mypace.llll-ll.com"

# Issue #39: Nostalgic Ranking 連携。
# NOSTALGIC_TOKEN は秘密値なのでここには書かない。
#   本番: wrangler secret put NOSTALGIC_TOKEN
#   ローカル: apps/api/.dev.vars に NOSTALGIC_TOKEN=... を書く
# NOSTALGIC_API_BASE は本番では未設定（既定の https://api.nostalgic.llll-ll.com を使う）。

# D1 binding
# 本番 DB の UUID は wrangler d1 create farm-in-pocket で取得したものを使う。
# ローカル開発は `pnpm migrate:local` でローカル sqlite に migration が適用される
# （.wrangler/state/v3/d1/ に sqlite ファイルが生成される）。
[[d1_databases]]
binding = "DB"
database_name = "farm-in-pocket"
database_id = "d135eec8-08e3-42a8-b624-1feae992acc7"
migrations_dir = "migrations"

# --- 本番カスタムドメイン設定 ---
# llll-ll.com の DNS は Cloudflare 管理。
[[routes]]
pattern = "api.farm-in-pocket.llll-ll.com"
zone_name = "llll-ll.com"
custom_domain = true
